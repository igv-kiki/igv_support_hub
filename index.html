<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iGV 客服工作台 · 交互 Demo</title>
<style>
:root{--bg:#f2f3f5;--panel:#fff;--line:#e5e7eb;--line2:#eff0f2;--ink:#15171c;--ink2:#555c69;--ink3:#8d94a1;--brand:#0c8f62;--brand-bg:#e7f6ef;--buyer:#2563eb;--buyer-bg:#eaf1ff;--seller:#7c3aed;--seller-bg:#f1eaff;--note:#fff6d1;--note-line:#e9bf3a;--note-ink:#7a5a00;--danger:#d92d20;--danger-bg:#fdecea;--warn:#c76a06;--warn-bg:#fff1dd;--r:10px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;min-width:1180px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.app{display:flex;flex-direction:column;height:100vh}
/* top bar */
.top{height:50px;flex:none;background:#12161c;color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.3px}
.logo small{font-weight:400;color:#9aa3b2;font-size:12px}
.demo-switch{display:flex;align-items:center;gap:8px;margin-left:10px;padding:4px 6px 4px 10px;border:1px dashed #3b4350;border-radius:9px;font-size:12px;color:#9aa3b2;white-space:nowrap}
.seg{display:flex;background:#232a33;border-radius:7px;padding:2px}
.seg button{border:0;background:none;color:#aeb6c4;padding:4px 12px;border-radius:5px;font-size:12px}
.seg button.on{background:#fff;color:#12161c;font-weight:600}
.top select{background:#232a33;color:#fff;border:0;border-radius:6px;padding:5px 8px;font-size:12px}
.top .sp{flex:1}
.tbtn{border:1px solid #3b4350;background:none;color:#dfe3ea;border-radius:7px;padding:5px 11px;font-size:12px;white-space:nowrap}
.tbtn:hover{background:#232a33}
.tbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.me{display:flex;align-items:center;gap:7px;font-size:12px;color:#dfe3ea;white-space:nowrap}
/* layout */
.main{flex:1;display:flex;min-height:0}
.nav{width:196px;flex:none;background:#fafafb;border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
.nav h5{margin:12px 8px 4px;font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.5px}
.nav h5:first-child{margin-top:2px}
.q{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 9px;border-radius:7px;color:var(--ink2)}
.q:hover{background:#eef0f2}
.q.on{background:#e4ebe8;color:var(--ink);font-weight:600}
.q .n{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:500;font-variant-numeric:tabular-nums}
.q .n.hot{background:var(--danger);color:#fff;border-radius:9px;padding:0 6px;font-weight:600}
.q .n.warm{background:var(--brand);color:#fff;border-radius:9px;padding:0 6px;font-weight:600}
.q .d{width:7px;height:7px;border-radius:50%;background:#c3c8d0;flex:none}
.list{width:330px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-h{padding:10px 12px 8px;border-bottom:1px solid var(--line2)}
.list-h .row{display:flex;align-items:center;gap:8px}
.list-h h3{font-size:14px;flex:1}
.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#f7f8f9;margin-top:8px;outline:0}
.search:focus{border-color:var(--brand);background:#fff}
.chips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 10px;font-size:12px;color:var(--ink2)}
.chipb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chipb b{font-weight:600;margin-left:3px}
.items{flex:1;overflow:auto}
.it{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-bottom:1px solid var(--line2);position:relative}
.it:hover{background:#f7f8f9}
.it.on{background:#eef6f2}
.it.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.it .r1{display:flex;align-items:center;gap:6px}
.it .ttl{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tm{font-size:11px;color:var(--ink3);flex:none}
.it .sub{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.it .last{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.it.unread .last{color:var(--ink);font-weight:500}
.it .r4{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.badge{background:var(--danger);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600;margin-left:auto}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}
/* tags */
.tg{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap;background:#eef0f2;color:var(--ink2)}
.tg.buyer{background:var(--buyer-bg);color:var(--buyer)}
.tg.seller{background:var(--seller-bg);color:var(--seller)}
.tg.agent{background:var(--brand-bg);color:var(--brand)}
.tg.group{background:#12161c;color:#fff}
.tg.bs{background:#eef0f2;color:var(--ink2)}
.tg.red{background:var(--danger-bg);color:var(--danger)}
.tg.amber{background:var(--warn-bg);color:var(--warn)}
.tg.green{background:var(--brand-bg);color:var(--brand)}
.tg.note{background:var(--note);color:var(--note-ink)}
.tg.line{background:#fff;border:1px solid var(--line);font-weight:500}
.tg.x{cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;background:#8d94a1}
.av.s{width:18px;height:18px;font-size:9px}
.av.l{width:40px;height:40px;font-size:14px}
.av.buyer{background:var(--buyer)}.av.seller{background:var(--seller)}.av.agent{background:var(--brand)}
/* chat */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#f7f8f9}
.ch{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
.ch .r1{display:flex;align-items:center;gap:8px}
.ch h2{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .who{font-size:12px;color:var(--ink2);margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ch .acts{margin-left:auto;display:flex;gap:6px;flex:none;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.warn{background:var(--note-line);border-color:var(--note-line);color:#3d2e00;font-weight:600}
.btn.danger{color:var(--danger);border-color:#f3c2bd}
.btn.sm{padding:2px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.hbar{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink2)}
.hbar label{display:flex;align-items:center;gap:5px;white-space:nowrap}
.hbar select,.sel{border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#fff;font-size:12px;max-width:150px}
.next{flex:1;min-width:200px;display:flex;align-items:center;gap:6px}
.next input{flex:1;border:1px solid transparent;border-radius:6px;padding:3px 6px;background:#f3f4f6;font-size:12px;outline:0}
.next input:focus{border-color:var(--brand);background:#fff}
.stages{display:flex;gap:0;align-items:center;font-size:11px}
.stages span{padding:2px 9px;background:#eef0f2;color:var(--ink3);position:relative}
.stages span:first-child{border-radius:10px 0 0 10px}.stages span:last-child{border-radius:0 10px 10px 0}
.stages span.done{background:var(--brand-bg);color:var(--brand)}
.stages span.cur{background:var(--brand);color:#fff;font-weight:600}
.strip{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12px;border-bottom:1px solid var(--line)}
.strip.info{background:#eef6f2;color:#0a5c40}
.strip.task{background:var(--warn-bg);color:#7a4300}
.strip.prev{background:#12161c;color:#fff}
.strip.red{background:var(--danger-bg);color:#8f1d14}
.strip .sp{flex:1}
.msearch{display:flex;align-items:center;gap:8px;padding:6px 16px;background:#fff;border-bottom:1px solid var(--line)}
.msearch input{flex:1;border:1px solid var(--line);border-radius:6px;padding:4px 8px;outline:0}
.msgs{flex:1;overflow:auto;padding:14px 18px 8px}
.m{display:flex;gap:8px;margin:10px 0;max-width:78%;position:relative}
.m.mine{margin-left:auto;flex-direction:row-reverse}
.m .bd{min-width:0}
.m .meta{font-size:11px;color:var(--ink3);display:flex;gap:6px;align-items:center;margin-bottom:3px}
.m.mine .meta{justify-content:flex-end}
.m .meta b{color:var(--ink);font-weight:600;font-size:12px}
.bub{background:#fff;border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 11px;white-space:pre-wrap;word-break:break-word;display:inline-block;text-align:left}
.m.mine .bub{border-radius:12px 4px 12px 12px}
.m.buyer .bub{border-left:3px solid var(--buyer)}
.m.seller .bub{border-left:3px solid var(--seller)}
.m.agent .bub{background:var(--brand-bg);border-color:#bfe5d3}
.m.mine.buyer .bub,.m.mine.seller .bub{border-left:1px solid var(--line);background:#12161c;color:#fff;border-color:#12161c}
.m.mine .bd{text-align:right}
.m .foot{font-size:11px;color:var(--ink3);margin-top:2px}
.m .ops{position:absolute;top:-6px;right:0;display:none;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:2px;z-index:2;white-space:nowrap}
.m.mine .ops{right:auto;left:0}
.m:hover .ops{display:flex}
.ops button{border:0;background:none;padding:2px 7px;font-size:11px;color:var(--ink2);border-radius:5px}
.ops button:hover{background:#f0f1f3;color:var(--ink)}
.quote{border-left:2px solid #c3c8d0;padding:1px 7px;margin-bottom:5px;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.tr{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(128,128,128,.4);font-size:12px;opacity:.85}
.gone{font-style:italic;color:var(--ink3)}
.hid{opacity:.55;text-decoration:line-through}
.att{display:flex;align-items:center;gap:9px;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:6px 9px 6px 6px;background:#fff;color:var(--ink);cursor:pointer;min-width:200px;text-align:left}
.att .th{width:44px;height:44px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#31445c,#6f89a8);background-size:cover;background-position:center}
.att.video .th{background:linear-gradient(135deg,#3b2f5c,#8a6fc0)}
.att.file .th{background:linear-gradient(135deg,#5c4a2f,#b59460)}
.att .nm{font-size:12px;font-weight:600;word-break:break-all}
.att .sz{font-size:11px;color:var(--ink3)}
.sys{text-align:center;margin:12px 0}
.sys span{display:inline-block;background:#e9ebee;color:var(--ink2);font-size:11.5px;padding:3px 12px;border-radius:12px;max-width:86%}
.sys.int span{background:var(--note);color:var(--note-ink);border:1px dashed var(--note-line)}
.sys a,.lnk{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-size:inherit}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0 16px;color:var(--brand);font-size:12px;font-weight:600}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--brand)}
.divider small{display:block;font-weight:400;color:var(--ink2);text-align:center}
.note{margin:10px 0;border:1px solid var(--note-line);border-left:4px solid var(--note-line);border-radius:8px;padding:8px 12px;background:repeating-linear-gradient(135deg,var(--note),var(--note) 12px,#fff1bd 12px,#fff1bd 24px);position:relative}
.note .nh{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--note-ink);margin-bottom:3px;font-weight:600}
.note .nh .ops{top:4px}
.note:hover .ops{display:flex}
.note .ops{position:absolute;right:6px;top:4px;display:none;background:#fff;border:1px solid var(--line);border-radius:7px;padding:2px}
.note .nb{white-space:pre-wrap;color:#3d2e00}
.note.locked{background:#f3f4f6;border-color:#d5d8de;border-style:dashed;color:var(--ink3);font-size:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:10px 12px;margin:10px 0}
.card.order{max-width:420px;margin-left:auto;margin-right:auto}
.card.dir{border:1.5px solid var(--brand);max-width:520px;margin-left:auto;margin-right:auto}
.card.dir.over{border-color:var(--danger)}
.card.res{border:1.5px solid var(--ink);max-width:540px;margin-left:auto;margin-right:auto}
.card h4{font-size:13px;display:flex;align-items:center;gap:6px}
.card .kv{margin-top:6px}
.card .cf{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
/* composer */
.comp{background:#fff;border-top:1px solid var(--line);padding:8px 14px 10px;position:relative}
.modes{display:flex;gap:4px;margin-bottom:6px;align-items:center}
.modes button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 11px;font-size:12px;color:var(--ink2)}
.modes button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.modes button.on.dirm{background:var(--ink);border-color:var(--ink)}
.modes button.on.notem{background:var(--note-line);border-color:var(--note-line);color:#3d2e00}
.aud{font-size:12px;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--ink2)}
.comp.note-mode{background:repeating-linear-gradient(135deg,var(--note),var(--note) 12px,#fff1bd 12px,#fff1bd 24px);border-top:2px solid var(--note-line)}
.comp.note-mode textarea{background:#fffdf2;border-color:var(--note-line)}
.comp textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;resize:none;height:64px;outline:0;display:block}
.comp textarea:focus{border-color:var(--brand)}
.cbar{display:flex;align-items:center;gap:4px;margin-top:6px}
.cbar .sp{flex:1}
.cbar .hint{font-size:11px;color:var(--ink3);margin-right:8px}
.ib{border:0;background:none;border-radius:6px;padding:4px 8px;font-size:12px;color:var(--ink2)}
.ib:hover{background:#f0f1f3}
.replying{display:flex;align-items:center;gap:8px;font-size:12px;background:#f3f4f6;border-radius:6px;padding:4px 8px;margin-bottom:6px;color:var(--ink2)}
.warnbox{background:var(--danger-bg);color:#8f1d14;border:1px solid #f3c2bd;border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:6px}
.closedbar{background:#fff;border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;color:var(--ink2)}
.closedbar .sp{flex:1}
details.pop{position:relative;display:inline-block}
details.pop>summary{list-style:none;cursor:pointer}
details.pop>summary::-webkit-details-marker{display:none}
.menu{position:absolute;bottom:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:5px;min-width:200px;z-index:20}
.menu.down{bottom:auto;top:calc(100% + 6px);left:auto;right:0}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;font-size:12px}
.menu button:hover{background:#f0f1f3}
.menu .mh{font-size:11px;color:var(--ink3);padding:4px 10px}
.menu.emo{display:grid;grid-template-columns:repeat(6,1fr);min-width:0;width:200px}
.menu.emo button{text-align:center;font-size:16px;padding:4px}
/* context */
.ctx{width:356px;flex:none;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;flex:none}
.tabs button{border:0;background:none;padding:10px 10px 8px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--brand)}
.cbody{flex:1;overflow:auto;padding:12px}
.sec{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:10px}
.sec>h4{font-size:12px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.sec>h4 .sp{flex:1}
details.sec>summary{font-size:12px;color:var(--ink2);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:after{content:"▸";margin-left:auto;color:var(--ink3)}
details.sec[open]>summary:after{content:"▾"}
details.sec[open]>summary{margin-bottom:8px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;font-size:12px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;word-break:break-word}
.ohead{display:flex;gap:10px;align-items:flex-start}
.gico{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;flex:none;text-align:center;line-height:1.1}
.gico.Coins{background:linear-gradient(135deg,#b7791f,#ecc94b)}
.gico.Accounts{background:linear-gradient(135deg,#2b4c7e,#5a8dee)}
.gico.Items{background:linear-gradient(135deg,#7b2d8e,#c06ad6)}
.gico.Boosting{background:linear-gradient(135deg,#9b2c2c,#f56565)}
.ohead .t{font-weight:600}
.ohead .s{font-size:12px;color:var(--ink2)}
.price{font-weight:700;font-size:15px;margin-left:auto;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:#e9ebee;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.red i{background:var(--warn)}
.rowl{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line2);font-size:12px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rowl:first-of-type{border-top:0}
button.rowl:hover{background:#f7f8f9}
.rowl .g{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowl .dim{color:var(--ink3);flex:none}
.acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stat div{background:#f7f8f9;border-radius:7px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:14px}
.stat span{font-size:11px;color:var(--ink3)}
.ph{display:flex;gap:10px;align-items:center}
.ph .n{font-weight:700;font-size:14px}
.guide{font-size:12px;color:var(--ink2);padding-left:16px;margin:0}
.guide li{margin:2px 0}
.tl{font-size:12px;border-left:2px solid var(--line);margin-left:4px;padding-left:12px}
.tl div{position:relative;padding:3px 0}
.tl div:before{content:"";position:absolute;left:-17px;top:9px;width:8px;height:8px;border-radius:50%;background:#c3c8d0}
.tl time{color:var(--ink3);margin-right:6px;font-variant-numeric:tabular-nums}
.priv{font-size:11px;color:var(--ink3);text-align:center;padding:4px 0 10px}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(15,18,24,.45);z-index:50;display:grid;place-items:center}
.modal{background:#fff;border-radius:14px;width:520px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:720px}
.mh1{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-weight:700;font-size:15px}
.mh1 button{margin-left:auto;border:0;background:none;font-size:18px;color:var(--ink3)}
.mb{padding:16px 18px;overflow:auto}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:0;background:#fff}
.fld textarea{height:70px;resize:vertical}
.fld .help{font-size:11px;color:var(--ink3);margin-top:3px}
.fld .opt{display:flex;gap:6px;align-items:flex-start;font-size:12px;font-weight:400;color:var(--ink);margin:3px 0}
.drawer-ov{position:fixed;inset:0;background:rgba(15,18,24,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:94vw;background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.drawer.wide{width:860px}
.drawer .msgs{background:#f7f8f9}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#12161c;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:grid;place-items:center;color:#fff}
.lightbox .pic{width:min(720px,80vw);height:min(440px,60vh);border-radius:12px;background:linear-gradient(135deg,#31445c,#6f89a8);display:grid;place-items:center;font-size:16px;background-size:contain;background-repeat:no-repeat;background-position:center}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#f7f8f9;font-weight:600}
.doc h3{font-size:14px;margin:18px 0 6px}.doc h3:first-child{margin-top:0}
.doc p,.doc li{color:#333a45;font-size:13px;line-height:1.7}
.doc ul{padding-left:18px;margin:4px 0}
.y{color:var(--brand);font-weight:700}.nn{color:var(--danger);font-weight:700}
mark{background:#ffe066;border-radius:2px}
.stars button{border:0;background:none;font-size:22px;color:#d1d5db;padding:0 2px}
.stars button.on{color:#f5b301}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#c3c8d0}
.dot.on{background:#22c55e}

@media(max-width:1440px){.nav{width:172px}.list{width:292px}.ctx{width:324px}.q{padding:7px 6px;font-size:12.5px}}

const DOCS={
design:`
<h3>1. 整体定位</h3>
<p>这不是"带聊天窗口的后台"，而是一个<b>以订单为上下文、以待办为入口的统一会话中心</b>。买家、卖家、平台客服用的是同一套会话数据，只是各自看到不同的信息切面和操作权限。</p>
<h3>2. 信息架构：为什么是「一个会话模型 + 四种类型」</h3>
<ul>
<li><b>统一会话模型</b>：每个会话 = 参与者 + 关联业务对象（订单 / 商品 / 提现 / 处罚 / 商品审核）+ 消息流 + 处理状态 + 审计日志。四种沟通模式只是 <code>type</code> 不同（买卖直聊 / 买家咨询 / 卖家咨询 / 三方群组），列表、消息、搜索、历史、权限全部复用。以后新增模式（如 卖家↔卖家、平台↔代练师）不需要再建一套系统。</li>
<li><b>客服端四栏</b>：队列（我该做什么）→ 会话列表（先做哪个）→ 沟通区（怎么说）→ 业务信息（凭什么判断）。从左到右就是客服处理一个问题的顺序。</li>
<li><b>队列按"球在谁手里"划分</b>，而不是按渠道划分：需我处理 / 未分配 / 已超时 / 等待买家 / 等待卖家 / 等待内部。客服不用翻聊天记录找待办；"等待"类队列也能防止会话沉底被遗忘。</li>
<li><b>处理条</b>（会话标题下方）固定回答三个问题：<b>谁负责、等谁、下一步是什么</b>。"下一步"是一行可编辑文字，换班或转交时接手人一眼能接上。</li>
<li><b>右侧业务区按对象分 Tab</b>（订单 / 买家 / 卖家 / 处理记录），核心信息直接展示，历史与低频信息折叠，深度详情进抽屉，避免堆砌。订单卡按品类变化：游戏币显示已交付数量和收货角色，账号显示质保期与改绑状态，代练显示段位进度，并附对应的处理指引。</li>
</ul>
<h3>3. 三个视角的主要区别</h3>
<table class="t"><tr><th style="width:90px"></th><th>买家</th><th>卖家</th><th>平台客服</th></tr>
<tr><td>列表组织</td><td>按"我在和谁说"：卖家 / 平台客服 / 订单协调</td><td>按"我要不要回"：待回复 / 等待买家 / 等待平台 / 已结束</td><td>按"球在谁手里" + 专项队列</td></tr>
<tr><td>右侧信息</td><td>订单摘要、交付进度、卖家公开信息、平台处理进度</td><td>订单摘要、交付所需买家信息（脱敏）、履约操作</td><td>完整订单、买卖家画像、资金、处罚、历史、审计</td></tr>
<tr><td>关键动作</td><td>申请客服介入、提交凭证、确认收货、举报、评价</td><td>提交交付信息、补充凭证、标记解决、邀请客服介入</td><td>接入、分配 / 转交、内部备注、处理要求、退款 / 冻结、结案</td></tr>
<tr><td>看不到</td><td>卖家后台数据、买家以外的隐私、任何内部内容</td><td>买家邮箱 / 手机 / 支付方式、任何内部内容</td><td>—（按授权；内部讨论仅负责人与协作成员）</td></tr></table>
<h3>4. 四种沟通模式如何协同</h3>
<ul>
<li><b>买卖直聊 → 三方群组（原地升级）</b>：买家或卖家点"申请客服介入"，或客服在风险巡检中主动介入，<b>同一个会话直接变成群组</b>，之前的记录全部保留，谁都不用重复描述。会话里插入一条明显的"平台已介入"分隔线。</li>
<li><b>买家 / 卖家咨询 → 三方群组（新建并关联）</b>：一对一咨询里有用户隐私和客服判断，不能直接把另一方拉进来。因此客服升级时<b>新建群组</b>，用"问题摘要"向双方说明，两个会话互相关联，客服可一键跳转。</li>
<li><b>同一订单只允许一个进行中的群组</b>：重复升级会直接打开已有群组，避免信息分散、重复处理。</li>
<li>所有会话都挂在订单上：在订单卡里能看到"本订单的其他会话"，任何一段沟通都能顺着订单找到。</li>
</ul>
<h3>5. 三方群组的核心交互与权限</h3>
<ul>
<li><b>客服是主持人而不是第三个聊天者</b>：有三种发言方式——公开回复、处理要求（指定对象 + 时限 + 需提交的东西，自动倒计时、逾期进入超时队列、对方完成后自动回到"待客服"）、内部备注。</li>
<li><b>防误发</b>：内部备注的输入区整体变为黄色斜纹，按钮文案变为"保存内部备注"；公开发送时明确列出"发送给：买家 X、卖家 Y"；群组内公开消息若含"风控 / 保证金 / 内部"等词会被拦下二次确认；客服可随时"预览买家 / 卖家所见"。</li>
<li><b>两级内部可见性</b>：内部备注（全体客服可见）与内部讨论（仅负责人、协作成员、主管可见）。切换到 Leo Wang 身份查看群组即可看到被锁定的内部讨论占位。</li>
<li><b>对外只有一个"iGV 客服"</b>：转交、换班、邀请内部同事，买卖家侧都无感知，不会看到客服姓名和内部成员。</li>
<li><b>闭环</b>：处理阶段（受理→取证→裁定→执行→结案）对三方可见；结案时发布结论卡片（结论、责任方、后续责任人、期限），买卖双方确认或提出异议；归档后只读、记录永久保留，可重新开启。</li>
<li><b>成员管理</b>：外部参与者只能是该订单的买家和卖家；移出 / 重新邀请都有系统消息和审计记录；被移出者只能看到移出前的记录；新建群组的成员看不到加入前的内容。</li>
</ul>

<p style="background:var(--warn-bg);padding:8px 10px;border-radius:8px">说明：本次只收到了需求文档与字段功能表，<b>旧版 Demo 文件未随消息上传</b>，因此下面是针对"按沟通模式分别建聊天窗口"这类常见旧架构的改进点，未与旧版逐页对照。补发旧版后可以再做一轮逐项比对。</p>
<ul>
<li>从"按聊天对象找会话"改为"按待办状态找会话"，并加入 SLA 倒计时与逾期队列。</li>
<li>四种模式合并为统一会话体系，一对一可升级为群组，不丢上下文。</li>
<li>公开消息 / 处理要求 / 内部备注 / 内部讨论 / 系统消息五类在视觉与操作上完全分开。</li>

<li>品类化：游戏币 / 账号 / 道具 / 代练各有对应的交付字段、默认问题类型、快捷回复与处理指引。</li>
</ul>
<h3>7. 字段表之外补充的功能及业务价值</h3>

<li><b>预览对方视角</b>：发敏感内容前自查，降低内部信息泄露风险。</li>
<li><b>下一步字段 + 强制交接备注</b>：减少换班断层。</li>

function av(uid,vr,cls=''){const u=usr(uid);if(!u)return'';if(u.role==='agent'&&vr!=='agent')return`<span class="av agent ${cls}">iGV</span>`;return`<span class="av ${u.role} ${cls}">${esc(u.bot?'⚙':u.name.replace(/[^A-Za-z一-龥]/g,'').slice(0,2).toUpperCase())}</span>`}
function uname(uid,vr){const u=usr(uid);if(!u)return'系统';if(u.role==='agent'&&vr!=='agent')return'iGV 客服';return u.name}
const tg=(t,cls='')=>`<span class="tg ${cls}">${esc(t)}</span>`;
const buyerId=c=>(c.members.find(m=>m.role==='buyer')||{}).uid||(c.orderId&&ord(c.orderId).buyer)||null;
const sellerId=c=>(c.members.find(m=>m.role==='seller')||{}).uid||(c.orderId&&ord(c.orderId).seller)||(c.productId&&DB.P[c.productId].seller)||null;
const isOpen=c=>c.status==='open';
const member=(c,uid)=>c.members.find(m=>m.uid===uid);
const canTeam=(c,uid)=>c.assignee===uid||!!member(c,uid)||!!usr(uid).lead;
function refLabel(r){return r?({withdraw:'提现记录',listing:'商品',penalty:'处罚记录'}[r.kind]+' '+r.id):''}
function convTitle(c,vr){const b=buyerId(c),s=sellerId(c);
 if(vr==='agent'){if(c.type==='group')return c.topic+' · 订单群组';if(c.type==='bp')return usr(b).name+' · '+c.topic;if(c.type==='sp')return usr(s).name+' · '+c.topic;return usr(b).name+' ⇄ '+usr(s).name}
 if(c.type==='group')return'订单协调 · '+c.topic;if(c.type==='bs')return vr==='buyer'?usr(s).store:usr(b).name;return'iGV 客服 · '+c.topic}
function convSub(c){if(c.orderId){const o=ord(c.orderId);return'#'+o.id+' · '+o.title}if(c.productId)return'商品咨询 · '+DB.P[c.productId].title;if(c.ref)return refLabel(c.ref);return'未关联订单'}
function vis(c,m,vr,uid){if(vr==='agent')return true;if(m.vis==='internal')return false;if(m.only&&!m.only.includes(vr))return false;const mbr=member(c,uid);if(!mbr)return false;if(m.t<mbr.joinedAt)return false;if(mbr.removedAt&&m.t>mbr.removedAt)return false;return true}
function brief(c,m,vr){if(m.recalled)return'撤回了一条消息';if(m.kind==='note')return'🔒 备注：'+m.text;if(m.kind==='directive')return'📋 处理要求：'+m.text;if(m.kind==='resolution')return'⚖️ 处理结论：'+(c.resolution?c.resolution.verdict:'');if(m.kind==='divider')return m.text;if(m.att&&!m.text)return'['+({image:'图片',video:'视频',file:'文件'}[m.att.type])+'] '+m.att.name;if(m.kind==='sys')return m.text;return(m.from!=='sys'?uname(m.from,vr)+'：':'')+m.text}
function lastMsg(c,vr,uid){for(let i=c.msgs.length-1;i>=0;i--){const m=c.msgs[i];if(m.kind!=='order'&&vis(c,m,vr,uid)&&!(m.kind==='note'&&m.scope==='team'&&!canTeam(c,uid)))return m}return null}
function unread(c,uid,vr){if(vr==='agent'&&c.assignee&&c.assignee!==uid&&!member(c,uid))return 0;if(vr==='agent'&&c.type==='bs')return 0;const r=c.read[uid]||0;return c.msgs.filter(m=>m.t>r&&m.from!==uid&&m.kind!=='order'&&vis(c,m,vr,uid)).length}
const pendingDirs=(c,r)=>c.msgs.filter(m=>m.kind==='directive'&&m.dir.st[r]==='pending');
const allPending=c=>c.msgs.filter(m=>m.kind==='directive'&&Object.values(m.dir.st).includes('pending'));
function isOverdue(c){if(!isOpen(c))return false;if(c.waiting==='support'&&c.dueAt&&c.dueAt<Date.now())return true;return allPending(c).some(m=>m.dir.dueAt<Date.now())}
function slaChip(c){if(!isOpen(c))return'';let h='';if(c.waiting==='support'&&c.dueAt){const d=c.dueAt-Date.now();h+=d<0?tg('响应超时 '+dur(d),'red'):tg('剩 '+dur(d)+' 需回复',d<3e5?'amber':'line')}const od=allPending(c).filter(m=>m.dir.dueAt<Date.now());if(od.length)h+=tg('要求逾期','red');return h}
function waitChip(c){if(c.status==='closed')return tg('已关闭 · 归档');if(c.status==='resolved')return tg('已解决','green');const w=c.waiting;if(c.type==='bs')return c.risk.length||c.reports.length?tg('风险待核查','red'):tg('买卖沟通中','line');if(!c.assignee&&c.type!=='bs')return tg('待接入','red');return w==='support'?tg('待客服回复','agent'):w==='buyer'?tg('等待买家','buyer'):w==='seller'?tg('等待卖家','seller'):w==='both'?tg('等待双方'):w==='internal'?tg('等待内部','note'):tg('进行中','line')}
function extStatus(c,vr,uid){if(c.status!=='open')return'done';if(pendingDirs(c,vr).length)return'todo';if(c.type==='bs'){const l=[...c.msgs].reverse().find(m=>m.kind==='text');return l&&l.from===uid?'other':'todo'}const w=c.waiting;if(w===vr||w==='both')return'todo';if(!w||w==='support'||w==='internal')return'plat';return'other'}
function extChip(c,vr,uid){const s=extStatus(c,vr,uid);if(s==='done')return c.status==='resolved'?tg('已解决','green'):tg('已结束');if(s==='todo')return tg('待你回复','amber');if(s==='plat')return tg('等待平台','agent');return tg(vr==='buyer'?'等待卖家':'等待买家','line')}
function typeTag(c,vr){if(vr==='agent')return tg(TYPE[c.type][0],TYPE[c.type][1]);if(c.type==='group')return tg('三方','group');if(c.type==='bs')return vr==='buyer'?tg('卖家','seller'):tg('买家','buyer');return tg('平台','agent')}
/* ---------- queues ---------- */
const QUEUES=[['h','我的工作'],
 ['todo','需我处理',c=>isOpen(c)&&c.assignee===me()&&c.waiting==='support','warm'],
 ['unassigned','未分配 · 待接入',c=>isOpen(c)&&!c.assignee&&c.type!=='bs','hot'],
 ['overdue','已超时 / 逾期',c=>c.type!=='bs'&&isOverdue(c),'hot'],
 ['h','等待中'],
 ['wb','等待买家',c=>isOpen(c)&&c.type!=='bs'&&c.assignee&&(c.waiting==='buyer'||c.waiting==='both')],
 ['ws','等待卖家',c=>isOpen(c)&&c.type!=='bs'&&c.assignee&&(c.waiting==='seller'||c.waiting==='both')],
 ['wi','等待内部处理',c=>isOpen(c)&&c.type!=='bs'&&c.waiting==='internal'],
 ['h','专项'],
 ['group','订单纠纷 · 三方群组',c=>c.type==='group'&&c.status!=='closed'],
 ['risk','买卖直聊 · 风险巡检',c=>c.type==='bs'&&(c.risk.length||c.reports.length)>0,'hot'],
 ['h','归档'],
 ['resolved','已解决',c=>c.status==='resolved'&&c.type!=='bs'],
 ['closed','已关闭',c=>c.status==='closed'&&c.type!=='bs'],
 ['all','全部会话',c=>c.type!=='bs'||c.risk.length||c.reports.length]];
function listFor(){const vr=role(),uid=me();let l;
 if(vr==='agent'){if(S.q){const q=S.q.toLowerCase();l=DB.convs.filter(c=>{const o=c.orderId&&ord(c.orderId);const hay=[convTitle(c,vr),convSub(c),o&&o.id,usr(buyerId(c)||'')?.name,usr(sellerId(c)||'')?.name,c.tags.join(' '),...c.msgs.map(m=>m.text)].join(' ').toLowerCase();return hay.includes(q)})}
  else{l=DB.convs.filter(QUEUES.find(q=>q[0]===S.queue)[2])}
  if(S.tf!=='all')l=l.filter(c=>c.type===S.tf)}
 else{l=DB.convs.filter(c=>member(c,uid));
  if(S.q){const q=S.q.toLowerCase();l=l.filter(c=>[convTitle(c,vr),convSub(c),...c.msgs.filter(m=>vis(c,m,vr,uid)).map(m=>m.text)].join(' ').toLowerCase().includes(q))}
  if(S.tf!=='all'){l=vr==='buyer'?l.filter(c=>({seller:'bs',plat:'bp',group:'group'}[S.tf])===c.type):l.filter(c=>extStatus(c,vr,uid)===S.tf)}}
 const lt=c=>{const m=lastMsg(c,vr,uid);return m?m.t:0};
 return l.sort((a,b)=>vr==='agent'&&S.queue==='todo'&&!S.q?(a.dueAt||9e15)-(b.dueAt||9e15):lt(b)-lt(a))}
/* ---------- top / nav / list ---------- */
function renderTop(){const vr=role();const ids=Object.values(DB.U).filter(u=>u.role===vr&&!u.bot);
 return`<div class="logo"><i>iGV</i>${vr==='agent'?'客服工作台 <small>Support Hub</small>':'iGV.com <small>消息中心 · '+RL[vr]+'端</small>'}</div>
 <div class="demo-switch">DEMO 视角<div class="seg">${['agent','buyer','seller'].map(r=>`<button class="${vr===r?'on':''}" data-a="role" data-v="${r}">${r==='agent'?'平台客服':RL[r]}</button>`).join('')}</div>
 <select data-c="identity" title="切换身份">${ids.map(u=>`<option value="${u.id}" ${u.id===me()?'selected':''}>${esc(u.name)}${u.team?' · '+u.team:''}${u.store?' · '+esc(u.store):''}</option>`).join('')}</select></div>
 <span class="sp"></span>
 <button class="tbtn pri" data-a="newConv">＋ ${vr==='agent'?'新建会话':'发起沟通'}</button>
 <button class="tbtn" data-a="docs" data-v="design">设计说明</button><button class="tbtn" data-a="docs" data-v="cover">字段覆盖</button><button class="tbtn" data-a="docs" data-v="perm">权限矩阵</button>
 <button class="tbtn" data-a="reset" title="恢复初始模拟数据">重置</button>
 <span class="me">${av(me(),'agent')}<span>${esc(usr(me()).name)}</span></span>`}
function renderNav(){return QUEUES.map(q=>{if(q[0]==='h')return`<h5>${q[1]}</h5>`;const n=DB.convs.filter(q[2]).length;return`<button class="q ${S.queue===q[0]&&!S.q?'on':''}" data-a="queue" data-v="${q[0]}"><span class="d"></span>${q[1]}<span class="n ${n&&q[3]?q[3]:''}">${n}</span></button>`}).join('')}
function renderListH(){const vr=role();let chips;
 if(vr==='agent')chips=[['all','全部'],['group','三方'],['bp','买家'],['sp','卖家'],['bs','买卖']];
 else if(vr==='buyer')chips=[['all','全部'],['seller','卖家'],['plat','平台客服'],['group','订单协调']];
 else chips=[['all','全部'],['todo','待回复'],['other','等待买家'],['plat','等待平台'],['done','已结束']];
 const ttl=vr==='agent'?(S.q?'搜索结果':QUEUES.find(q=>q[0]===S.queue)[1]):'我的消息';
 return`<div class="row"><h3>${ttl}</h3>${vr!=='agent'?`<button class="btn sm ghost" data-a="dndAll">${S.dnd.all?'🔕 免打扰中':'🔔 通知开'}</button>`:''}</div>
 <input class="search" id="lq" data-i="lq" placeholder="搜索 订单号 / 用户名 / 消息关键词" value="${esc(S.q)}">
 <div class="chips">${chips.map(c=>`<button class="chipb ${S.tf===c[0]?'on':''}" data-a="tf" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>`}
function renderItems(){const vr=role(),uid=me(),l=listFor();if(!l.length)return`<div class="empty">这里没有会话<br><small>${vr==='agent'?'换一个队列或清空搜索试试':'点击右上角「发起沟通」'}</small></div>`;
 return l.map(c=>{const m=lastMsg(c,vr,uid),n=unread(c,uid,vr);const a=c.assignee&&usr(c.assignee);
  return`<button class="it ${c.id===S.cid?'on':''} ${n?'unread':''}" data-a="open" data-id="${c.id}">
  <div class="r1">${typeTag(c,vr)}<span class="ttl">${esc(convTitle(c,vr))}</span><span class="tm">${m?rel(m.t):''}</span></div>
  <div class="sub">${vr==='agent'&&c.type==='group'?esc(usr(buyerId(c)).name+' ⇄ '+usr(sellerId(c)).name)+' · ':''}${esc(convSub(c))}</div>
  <div class="last">${m?esc(brief(c,m,vr)):''}</div>
  <div class="r4">${vr==='agent'?waitChip(c)+(c.priority==='urgent'||c.priority==='high'?tg('优先级 '+PRI[c.priority][0],PRI[c.priority][1]):'')+slaChip(c)+(c.type!=='bs'?(a?`<span class="tg line">${av(a.id,'agent','s')} ${esc(a.name)}</span>`:tg('未分配','line')):''):extChip(c,vr,uid)+(c.orderId?tg(ST[ord(c.orderId).st][0],ST[ord(c.orderId).st][1]):'')}
  ${n?`<span class="badge">${n}</span>`:''}</div></button>`}).join('')}
/* ---------- messages ---------- */
function hl(t){let h=esc(t);if(S.msearch){const q=esc(S.msearch).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(q)h=h.replace(new RegExp(q,'gi'),x=>`<mark>${x}</mark>`)}return h}
function orderMini(c,vr){if(!c.orderId)return'';const o=ord(c.orderId);return`<div class="card order"><div class="ohead"><span class="gico ${o.cat}">${GL[o.cat]}</span><div style="min-width:0"><div class="t">${esc(o.title)}</div><div class="s">#${o.id} · ${esc(o.spec)}</div></div><span class="price">${money(o.amount)}</span></div><div class="cf">${tg(ST[o.st][0],ST[o.st][1])}<span>交付：${esc(o.delivery.status)}</span><span style="flex:1"></span><button class="btn sm" data-a="orderDrawer" data-id="${o.key}">查看订单</button></div></div>`}
function attHtml(a){return`<button class="att ${a.type}" data-a="light" data-n="${esc(a.name)}" data-u="${esc(a.url||'')}" data-t="${a.type}"><span class="th" ${a.url&&a.type==='image'?`style="background-image:url(${esc(a.url)})"`:''}>${a.url&&a.type==='image'?'':{image:'IMG',video:'▶',file:'FILE'}[a.type]}</span><span><div class="nm">${esc(a.name)}</div><div class="sz">${esc(a.size||'')}${a.proof?' · 交付/问题凭证':''}</div></span></button>`}
function receipt(c,m,vr,uid){if(m.state==='sending')return'发送中…';if(m.kind==='note')return'';const rd=u=>(c.read[u]||0)>=m.t;const ext=c.members.filter(x=>x.role!=='agent'&&x.uid!==uid&&!x.removedAt);const agRead=c.members.some(x=>x.role==='agent'&&rd(x.uid));
 const parts=ext.map(x=>RL[x.role]+(rd(x.uid)?'已读':'未读'));if(vr!=='agent'&&c.type!=='bs')parts.push(agRead?'客服已读':'客服未读');return parts.length?'已送达 · '+parts.join(' · '):'已送达'}
function dirCard(c,m,vr,uid,ro){const d=m.dir,over=d.dueAt<Date.now(),pend=Object.values(d.st).includes('pending');const mine=vr!=='agent'&&d.st[vr]==='pending';
 return`<div class="card dir ${pend&&over?'over':''}" id="${m.id}"><h4>📋 平台处理要求 ${tg('对象：'+RL[d.to],d.to==='both'?'':d.to)} ${Object.entries(d.st).map(([r,s])=>tg(RL[r]+(s==='done'?' 已完成':' 待处理'),s==='done'?'green':over?'red':'amber')).join(' ')}</h4>
 <div style="margin-top:6px;white-space:pre-wrap">${hl(m.text)}</div>
 <div class="cf"><span>${uname(m.from,vr)} · ${fmt(m.t)}</span><span>截止 ${fmt(d.dueAt)}${pend?(over?' · <b style="color:var(--danger)">已逾期 '+dur(d.dueAt-Date.now())+'</b>':' · 剩 '+dur(d.dueAt-Date.now())):''}</span><span style="flex:1"></span>
 ${ro?'':mine?`<button class="btn pri sm" data-a="dirDone" data-id="${m.id}">${d.req==='proof'?'上传凭证并提交':d.req==='confirm'?'确认':'标记已回复'}</button>`:vr==='agent'&&pend?`<button class="btn sm" data-a="dirNudge" data-id="${m.id}">催办</button><button class="btn sm" data-a="dirClose" data-id="${m.id}">标记完成</button>`:''}</div></div>`}
function resCard(c,m,vr,uid,ro){const r=c.resolution;if(!r)return'';const cf=r.confirm||{};const can=!ro&&vr!=='agent'&&r.need&&cf[vr]==null&&c.status!=='closed';
 return`<div class="card res" id="${m.id}"><h4>⚖️ 平台处理结论 ${tg(r.verdict,'group')}</h4><div style="margin-top:6px;white-space:pre-wrap">${esc(r.text)}</div>
 <dl class="kv">${r.fault?`<dt>责任方</dt><dd>${esc(r.fault)}</dd>`:''}${r.owner?`<dt>后续责任人</dt><dd>${esc(vr==='agent'?(usr(r.owner)?usr(r.owner).name:r.owner):(usr(r.owner)?'iGV 客服':r.owner))}</dd>`:''}${r.due?`<dt>完成期限</dt><dd>${esc(r.due)}</dd>`:''}</dl>
 <div class="cf"><span>${uname(r.by,vr)} · ${fmt(r.t)}</span>${r.need?['buyer','seller'].map(x=>tg(RL[x]+(cf[x]==='ok'?' 已确认':cf[x]==='no'?' 有异议':' 待确认'),cf[x]==='ok'?'green':cf[x]==='no'?'red':'amber')).join(''):''}<span style="flex:1"></span>
 ${can?`<button class="btn sm danger" data-a="resConfirm" data-v="no">有异议</button><button class="btn pri sm" data-a="resConfirm" data-v="ok">确认结论</button>`:''}</div></div>`}
function msgHtml(c,m,vr,uid,ro){
 if(m.kind==='order')return orderMini(c,vr);
 if(m.kind==='divider')return`<div><div class="divider">🛡 ${esc(m.text)}</div><div class="sys" style="margin-top:-10px"><span>${esc(m.sub||'')}</span></div></div>`;
 if(m.kind==='sys')return`<div class="sys ${m.vis==='internal'?'int':''}"><span>${m.vis==='internal'?'🔒 ':''}${hl(m.text)}${m.link?` <button class="lnk" data-a="open" data-id="${m.link}">前往群组 →</button>`:''} · ${fmt(m.t)}</span></div>`;
 if(m.kind==='note'){if(m.scope==='team'&&!canTeam(c,uid))return`<div class="note locked">🔒 1 条内部讨论 · 仅本会话负责人与协作成员可见（${fmt(m.t)}）</div>`;
  return`<div class="note" id="${m.id}"><div class="nh">🔒 ${m.scope==='team'?'内部讨论 · 仅协作成员可见':'内部备注 · 全体客服可见'} <span style="font-weight:400">— ${esc(usr(m.from).name)} · ${fmt(m.t)} · 买家/卖家不可见</span></div><div class="nb">${hl(m.text)}</div>${!ro&&m.from===uid?`<div class="ops"><button data-a="msgDel" data-id="${m.id}">删除</button></div>`:''}</div>`}
 if(m.kind==='directive')return dirCard(c,m,vr,uid,ro);
 if(m.kind==='resolution')return resCard(c,m,vr,uid,ro);
 const u=usr(m.from),mine=m.from===uid&&!S.preview,cls=u.role;
 const rTag=u.role==='agent'?(vr==='agent'?tg(u.team||'客服','agent'):tg('平台','agent')):tg(RL[u.role],u.role);
 let body;
 if(m.recalled)body=`<div class="bub gone">${mine?'你':esc(uname(m.from,vr))}撤回了一条消息</div>`;
 else if(m.hidden&&vr!=='agent')body=`<div class="bub gone">该消息因违反平台规则已被屏蔽</div>`;
 else{const q=m.re&&c.msgs.find(x=>x.id===m.re);const showTr=m.tr&&(S.autoTr||S.trOn[m.id]);
  body=(!m.text&&m.att&&!q?'':`<div class="bub ${m.hidden?'hid':''}">${q?`<div class="quote">↩ ${esc(uname(q.from,vr))}：${esc(q.text||(q.att?q.att.name:''))}</div>`:''}${m.kind==='rules'?'<b>📌 群组规则与处理流程</b>\n':''}${hl(m.text)}${showTr?`<div class="tr">🌐 ${esc(m.tr)}</div>`:''}</div>`)+(m.att?attHtml(m.att):'')}
 const canRecall=mine&&!m.recalled&&Date.now()-m.t<12e4;
 const ops=ro||m.recalled?'':`<div class="ops"><button data-a="msgReply" data-id="${m.id}">引用</button><button data-a="msgCopy" data-id="${m.id}">复制</button>${m.tr?`<button data-a="msgTr" data-id="${m.id}">${S.trOn[m.id]?'原文':'翻译'}</button>`:''}${canRecall?`<button data-a="msgRecall" data-id="${m.id}">撤回</button>`:''}${vr==='agent'&&u.role!=='agent'?`<button data-a="msgHide" data-id="${m.id}">${m.hidden?'恢复':'屏蔽'}</button>`:''}</div>`;
 return`<div class="m ${cls} ${mine?'mine':''}" id="${m.id}">${av(m.from,vr)}<div class="bd"><div class="meta"><b>${esc(uname(m.from,vr))}</b>${rTag}<span>${fmt(m.t)}</span>${m.flag&&vr==='agent'?tg('⚠ '+m.flag,'red'):''}${m.hidden&&vr==='agent'?tg('已对外屏蔽','red'):''}</div>${body}${mine&&!m.recalled?`<div class="foot">${receipt(c,m,vr,uid)}</div>`:''}</div>${ops}</div>`}
function msgsHtml(c,vr,uid,ro){let l=c.msgs.filter(m=>vis(c,m,vr,uid));if(S.msearch&&!ro){const q=S.msearch.toLowerCase();l=l.filter(m=>(m.text||'').toLowerCase().includes(q)||(m.att&&m.att.name.toLowerCase().includes(q)))}
 const mbr=member(c,uid);let pre='';if(vr!=='agent'&&mbr&&c.msgs.some(m=>m.t<mbr.joinedAt&&m.vis==='public'))pre=`<div class="sys"><span>你于 ${fmt(mbr.joinedAt)} 加入，加入前的记录不可见</span></div>`;

function newBody(){const vr=role(),q=S.newQ.toLowerCase();const orow=(o,btns)=>`<div class="rowl"><span class="gico ${o.cat}" style="width:32px;height:32px;font-size:8px">${GL[o.cat]}</span><span class="g"><b>${esc(o.title)}</b><br><span style="color:var(--ink3)">#${o.id} · ${vr==='agent'?esc(usr(o.buyer).name+' ⇄ '+usr(o.seller).name):vr==='buyer'?esc(usr(o.seller).store):esc(usr(o.buyer).name)} · ${money(o.amount)}</span></span>${tg(ST[o.st][0],ST[o.st][1])}${btns}</div>`;

 else if(S.newTab==='product'){h+=Object.values(DB.P).map(p=>`<div class="rowl"><span class="gico ${p.cat}" style="width:32px;height:32px;font-size:8px">${GL[p.cat]}</span><span class="g"><b>${esc(p.title)}</b><br><span style="color:var(--ink3)">${esc(usr(p.seller).store)} · ${money(p.price)}</span></span><button class="btn sm" data-a="fromProduct" data-id="${p.id}">咨询卖家</button></div>`).join('')+'<div class="priv" style="padding-top:10px">模拟「商品详情页 → 联系卖家」入口，会话自动关联商品</div>'}
